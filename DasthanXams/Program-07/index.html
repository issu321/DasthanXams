<!DOCTYPE html>
<html>
<head>
<title>Dynamic User Directory</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { text-align: center; }
#search { display: block; margin: 10px auto; padding: 6px; width: 250px; }
#status { text-align: center; }
#users { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
.card { border: 1px solid #ccc; padding: 15px; width: 220px; background: #fff; }
button { display: block; margin: 20px auto; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
<h1>User Directory</h1>
<input id="search" placeholder="Search users by name...">
<p id="status">Loading users...</p>
<div id="users"></div>
<button id="reload">Reload Users</button>

<script>
var box = document.getElementById("users");
var info = document.getElementById("status");
var search = document.getElementById("search");
var usersData = [];

function loadUsers() {
  info.textContent = "Loading users...";
  box.innerHTML = "";
  fetch("https://jsonplaceholder.typicode.com/users")
    .then(function(res) {
      return res.json();
    })
    .then(function(data) {
      usersData = data;
      displayUsers(usersData);
    })
    .catch(function(err) {
      info.textContent = "Unable to load users. Please try again.";
    });
}

function displayUsers(users) {
  info.textContent = users.length + " user(s) found";
  box.innerHTML = "";
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    box.innerHTML += '<div class="card">' +
      '<h3>' + u.name + '</h3>' +
      '<p>Email: ' + u.email + '</p>' +
      '<p>City: ' + u.address.city + '</p>' +
      '<p>Company: ' + u.company.name + '</p>' +
      '</div>';
  }
}

search.oninput = function() {
  var query = search.value.toLowerCase();
  var filtered = [];
  for (var i = 0; i < usersData.length; i++) {
    if (usersData[i].name.toLowerCase().includes(query)) {
      filtered.push(usersData[i]);
    }
  }
  displayUsers(filtered);
};

document.getElementById("reload").onclick = loadUsers;
loadUsers();
</script>
</body>
</html>

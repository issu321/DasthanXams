<!DOCTYPE html>
<html>
<head><title>DOM Manipulation</title></head>
<body>
<h1 id="heading">Hello Students!</h1>
<p id="message">This is the original content.</p>
<img id="myImage" src="image.jpg" width="200"><br><br>
<button onclick="changePage()">Click Me</button>

<script>
function changePage() {
  document.getElementById("heading").innerHTML = "Welcome to JavaScript!";   // content
  document.getElementById("message").innerHTML = "The content has been changed.";
  document.body.style.backgroundColor = "lightblue";                        // color
  document.getElementById("myImage").src = "image2.jpg";                     // image
}
</script>
</body>
</html>
